name: Keep Legion Supabase Awake

on:
  schedule:
    # Runs every 3 days at 12:00 UTC — well under Supabase's ~7 day pause window
    - cron: '0 12 */3 * *'
  workflow_dispatch: {}  # lets you manually trigger a run from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Legion Supabase project
        run: |
          curl -s -o /dev/null -w "Response code: %{http_code}\n" \
            -H "apikey: sb_publishable_3zWv-d51jizmxDV4Pp55_Q_vkLDsFjW" \
            -H "Authorization: Bearer sb_publishable_3zWv-d51jizmxDV4Pp55_Q_vkLDsFjW" \
            "https://qqnniupykqrunepyobdi.supabase.co/rest/v1/characters?select=id&limit=1"
